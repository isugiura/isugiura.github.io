tropical-pacific-and-forcings:
  topic-name: Tropical Pacific's Responses to External Forcing
  description: >
    The tropical Pacific Ocean is key to climatic conditions around the world
    because it is home to the major mode of climate variability, the El 
    Niño–Southern Oscillation (ENSO). Yet the tropical Pacific’s response to 
    external radiative forcing remains uncertain, as observations and climate 
    model simulations disagree on the direction of historical SST trends. My 
    research focuses on identifying and characterizing this observation–model 
    discrepancy and on understanding the mechanisms behind the tropical 
    Pacific’s responses.

volcano-climate-interactions:
  topic-name: Climatic Signals of Volcanic Forcing
  description: >
    Explosive volcanic eruptions can affect the climate system by injecting 
    sulfur into the stratosphere, where sulfate aerosols reflect incoming solar 
    radiation and temporarily cool the Earth’s surface. This is also considered 
    an analog for a proposed geoengineering strategy to tackle anthropogenic 
    climate change. Beyond global mean cooling, volcanic forcing may produce 
    spatially and temporally complex responses in temperature, hydroclimate, and 
    atmospheric and oceanic dynamical processes. However, only a few large events 
    have occurred since the beginning of satellite observations, making it 
    difficult to estimate climatic responses to volcanic forcing and assess how 
    well climate models replicate them. I am particularly interested in 
    understanding these spatial and hydroclimatic responses, the mechanisms 
    driving them, and the discrepancies between climate models and observations.

