<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

</head>


<body>

  <!-- =========================
       HEADER
       ========================= -->

  <header class="site-header">

    <div class="header-inner">

      <div class="header-name">

        <a href="{{ '/' | relative_url }}">
          {{ site.title }}
        </a>

        <span>
          Your Position
        </span>

      </div>


      <nav class="site-nav">

        <a href="{{ '/' | relative_url }}">
          Home
        </a>

        <a href="{{ '/research-interests/' | relative_url }}">
          Research Interests
        </a>

        <a href="{{ '/publications/' | relative_url }}">
          Publications
        </a>

        <a href="{{ '/about/' | relative_url }}">
          About
        </a>

        <a href="{{ '/cv/' | relative_url }}">
          CV
        </a>

        <a href="{{ '/teaching/' | relative_url }}">
          Teaching Statement
        </a>

        <a href="{{ '/contact/' | relative_url }}">
          Contact
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       PAGE
       ========================= -->

  <div class="page-layout">

    {% include sidebar.html %}

    <main class="main-content">
      {{ content }}
    </main>

  </div>


  <!-- =========================
       FOOTER
       ========================= -->

  <footer class="site-footer">

    <div class="footer-inner">

      © {{ 'now' | date: "%Y" }} {{ site.title }}

    </div>

  </footer>


</body>

</html>
