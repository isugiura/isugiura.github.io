<aside class="sidebar">

  <img
    src="{{ '/assets/images/profile.jpg' | relative_url }}"
    alt="{{ site.title }}"
    class="profile-photo"
  >

  <h2>{{ site.title }}</h2>

  <p class="position">
    Your Position<br>
  </p>

  
  <div class="sidebar-divider"></div>


  <!-- Contact -->
  <div class="contact-info">

    <div>
      <i class="fa-solid fa-building-columns icon"></i>
      <span>Current affiliation</span>
    </div>

    <div>
      <i class="fa-solid fa-building-columns icon"></i>
      <span>Current affiliation#2</span>
    </div>

    <div>
      <i class="fa-solid fa-location-dot icon"></i>
      <span>City, State, Country</span>
    </div>

    <a href="mailto:your.email@example.com">
      <i class="fa-solid fa-envelope icon"></i>
      <span>your.email@example.com</span>
    </a>

  </div>


  <div class="sidebar-divider"></div>

  <!-- Resources -->
  <div class="resource-links">

    <a
      href="{{ '/assets/files/CV.pdf' | relative_url }}"
      target="_blank"
    >
      <i class="fa-solid fa-file-pdf icon"></i>
      <span>Download CV</span>
    </a>

    <a
      href="https://github.com/yourusername/project-collection"
      target="_blank"
    >
      <i class="fa-brands fa-github icon"></i>
      <span>Research Code</span>
    </a>

  </div>

  <div class="sidebar-divider"></div>

  <!-- Academic profiles -->
  <div class="academic-links">

    <a href="https://scholar.google.com/citations?user=YOUR-ID" target="_blank">
      <i class="fa-brands fa-google-scholar icon"></i>
      <span>Google Scholar</span>
    </a>

    <a href="https://www.researchgate.net/profile/Your-Name" target="_blank">
      <span class="icon researchgate">R<sup>G</sup></span>
      <span>ResearchGate</span>
    </a>

    <a href="https://orcid.org/YOUR-ORCID-ID" target="_blank">
      <i class="fa-brands fa-orcid icon"></i>
      <span>ORCID</span>
    </a>

    <a href="https://www.linkedin.com/in/yourusername/" target="_blank">
      <i class="fa-brands fa-linkedin-in icon"></i>
      <span>LinkedIn</span>
    </a>

    <a href="https://www.youruniversity.edu/" target="_blank">
      <i class="fa-solid fa-building-columns icon"></i>
      <span>Institutional Web Page</span>
    </a>

  </div>

  <div class="sidebar-divider"></div>

  <!-- Past affiliations -->
  <div class="sidebar-section">

    <h3>Past Affiliations</h3>

    <div class="past-affiliations">

      <div>
        <i class="fa-solid fa-building-columns icon"></i>
        <span>
          University Name<br>
          <small>Year-Year</small>
        </span>
      </div>

    </div>

  </div>

</aside>
