title: "Your Name"
description: "Personal website"
url: "https://yourname.github.io"

theme: null
markdown: kramdown

plugins:
  - jekyll-scholar

scholar:
  source: assets/files
  bibliography: papers.bib

  bibliography_template: bib

  style: apa
  locale: en

  sort_by: year
  order: descending

  query: "@*"

defaults:
  - scope:
      path: ""
    values:
      layout: default
